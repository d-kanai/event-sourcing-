<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>AsyncAPI Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="module" src="https://unpkg.com/@asyncapi/web-component@2.6.4/browser/index.js"></script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
      }
      asyncapi-component {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <asyncapi-component schema-url="./user-account.json" show="servers channels operations messages schemas" sidebar-visibility="true"></asyncapi-component>
  </body>
</html>
